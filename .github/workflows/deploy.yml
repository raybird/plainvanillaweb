name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Run Unit Tests
        # 這裡會自動掃描 tests/ 下的所有 .test.js 檔案
        run: node --test tests/*.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Syntax Check
        # 簡單的語法檢查，確保沒有基本的 JS 錯誤
        run: find . -name "*.js" -not -path "./node_modules/*" | xargs -n 1 node -c
      - name: Service Worker Version Check
        # 網站檔案內容有變動卻沒更新 sw.js 的 CACHE_NAME 時失敗，避免使用者一直拿到舊快取
        run: node scripts/update-sw-version.js --check
      - name: ADR Index Check
        # ADR 編號重複、標題編號與檔名不符，或索引沒有重新產生時失敗
        run: node scripts/update-adr-index.js --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 執行器使用內建 WebSocket（Node 22 起為全域物件）連線 Chrome DevTools Protocol
          node-version: '22'
      - name: Browser Tests
        # 以 runner 內建的 Chrome 執行 tests/browser.html 與整站冒煙測試（根目錄與 /plainvanillaweb/ 子路徑各一次）
        run: node tests/browser-runner.mjs

  deploy-info:
    needs: [test, lint, browser]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Ready to Deploy
        run: echo "Code verified. Integration complete."
