<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plain Vanilla Web Demo</title>
    <!-- 依實際部署路徑設定 <base>：GitHub Pages 為 /plainvanillaweb/，在 repo 根目錄啟動本機伺服器時為 / -->
    <script>
        (function () {
            var base = document.createElement('base');
            base.href = location.pathname.replace(/[^/]*$/, '');
            document.head.appendChild(base);
        })();
    </script>
    <script>
        window.__LAB_DEBUG__ = { errors: [], logs: [] };
        const originalError = console.error;
        console.error = (...args) => {
            window.__LAB_DEBUG__.errors.push(args.join(' '));
            originalError.apply(console, args);
        };
        window.addEventListener('error', (e) => {
            window.__LAB_DEBUG__.errors.push(`${e.message} at ${e.filename}:${e.lineno}`);
        });
        window.addEventListener('unhandledrejection', (e) => {
            window.__LAB_DEBUG__.errors.push(`Unhandled Rejection: ${e.reason}`);
        });
    </script>
    <!-- 使用相對路徑載入 CSS -->

    <!-- 載入 Google Fonts 提升字體學品質 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./index.css">
    
    <!-- 離線優先的 Lucide 圖示系統 -->
    <script src="./lib/lucide.min.js" defer></script>
    
    <!-- 使用相對路徑載入 JS -->
    <script type="module" src="./index.js?v=b4dd1045f33f" defer></script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
</head>

<body>
    <x-app></x-app>
</body>

</html>
