<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>BaseComponent 瀏覽器測試</title>
    <link rel="icon" href="data:,">
    <!-- 依實際部署路徑設定 <base> 為 tests/ 的上一層（應用根目錄） -->
    <script>
        (function () {
            var base = document.createElement('base');
            base.href = location.pathname.replace(/tests\/[^/]*$/, '');
            document.head.appendChild(base);
        })();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.3rem; }
        #summary { font-weight: bold; padding: .6rem 1rem; border-radius: 8px; margin: 1rem 0; }
        #summary.pass { background: #d4f7d4; color: #0a5d0a; }
        #summary.fail { background: #ffd6d6; color: #8a0a0a; }
        ul { list-style: none; padding: 0; }
        li { padding: .4rem .6rem; border-bottom: 1px solid #eee; font-family: ui-monospace, monospace; font-size: .9rem; }
        .ok::before { content: "✅ "; }
        .ng::before { content: "❌ "; }
        .ng { color: #b00020; }
        .err { color: #b00020; white-space: pre-wrap; padding-left: 1.6rem; font-size: .8rem; }
    </style>
</head>
<body>
    <h1>🍦 BaseComponent 瀏覽器測試</h1>
    <p>需透過 HTTP 開啟（<code>python3 -m http.server</code> → <code>/tests/browser.html</code>）。需要真實 DOM，故不在 Node 執行。</p>
    <div id="summary">執行中…</div>
    <ul id="results"></ul>

    <script type="module">
        import { BaseComponent } from './lib/base-component.js';

        // --- 極簡測試骨架 (零依賴) ---
        const results = [];
        const tests = [];
        const test = (name, fn) => tests.push({ name, fn });
        const assert = (cond, msg) => { if (!cond) throw new Error(msg || '斷言失敗'); };
        const assertEq = (a, b, msg) =>
            assert(a === b, `${msg || ''} 期望 ${JSON.stringify(b)}，實得 ${JSON.stringify(a)}`);
        // 等待 BaseComponent 的 rAF 批次更新刷新（兩個 frame 確保 scheduleUpdate 完成）
        const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        const host = document.createElement('div');
        host.style.position = 'absolute';
        host.style.left = '-9999px';
        document.body.appendChild(host);
        const mount = (el) => { host.appendChild(el); return el; };
        // 動態插入（而非寫在 HTML）：預載掃描器會在 <base> 設定前以 tests/ 解析靜態 <script src>，造成 404
        const loadLucide = () => typeof lucide !== 'undefined' ? Promise.resolve() : new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = new URL('./lib/lucide.min.js', document.baseURI).href;
            script.onload = resolve;
            script.onerror = () => reject(new Error('無法載入 lucide.min.js'));
            document.head.appendChild(script);
        });

        // === 測試案例 ===

        test('Light DOM 預設將 render() 結果寫入 innerHTML', () => {
            class C extends BaseComponent { render() { return '<p class="x">hi</p>'; } }
            customElements.define('t-light', C);
            const el = mount(document.createElement('t-light'));
            assert(!el.shadowRoot, '預設不應有 shadowRoot');
            assertEq(el.querySelector('.x')?.textContent, 'hi');
        });

        test('initReactiveState 變更後經 rAF 觸發重繪', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<span class="n">${this.state.n}</span>`; }
            }
            customElements.define('t-reactive', C);
            const el = mount(document.createElement('t-reactive'));
            assertEq(el.querySelector('.n').textContent, '0');
            el.state.n = 5;
            await nextFrame();
            assertEq(el.querySelector('.n').textContent, '5', '狀態變更後');
        });

        test('html`` 回傳值的內插值會被自動轉義', async () => {
            const { html } = await import('./lib/html.js');
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ v: '<img src=x onerror=alert(1)>' }); }
                render() { return html`<div class="out">${this.state.v}</div>`; }
            }
            customElements.define('t-safe', C);
            const el = mount(document.createElement('t-safe'));
            // 應為轉義後的文字，而非真的 <img> 元素
            assertEq(el.querySelector('.out').querySelector('img'), null, '不應產生真實 img');
            assert(el.querySelector('.out').textContent.includes('<img'), '應保留為轉義文字');
        });

        test('useShadow=true 時內容渲染進 shadowRoot', () => {
            class C extends BaseComponent {
                static useShadow = true;
                render() { return '<p class="s">shadow</p>'; }
            }
            customElements.define('t-shadow', C);
            const el = mount(document.createElement('t-shadow'));
            assert(el.shadowRoot, '應有 shadowRoot');
            assertEq(el.shadowRoot.querySelector('.s')?.textContent, 'shadow');
            assertEq(el.querySelector('.s'), null, 'Light DOM 不應有內容');
        });

        test('$slot 擷取首次渲染前的原始子內容', () => {
            class C extends BaseComponent {
                render() { return `<div class="wrap">${this.$slot()}</div>`; }
            }
            customElements.define('t-slot', C);
            const el = document.createElement('t-slot');
            el.innerHTML = '<b>slotted</b>';
            mount(el);
            assertEq(el.querySelector('.wrap b')?.textContent, 'slotted');
        });

        test('data-persistent 節點在重繪後保留 (同一個 DOM 實例)', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() {
                    return `<div><span class="n">${this.state.n}</span>
                            <div data-persistent-placeholder="keep"></div></div>`;
                }
                afterFirstRender() {
                    const ph = this.querySelector('[data-persistent-placeholder="keep"]');
                    const node = document.createElement('div');
                    node.setAttribute('data-persistent', 'keep');
                    node.innerHTML = '<input class="pers">';
                    ph.replaceWith(node);
                }
            }
            customElements.define('t-persist', C);
            const el = mount(document.createElement('t-persist'));
            const input = el.querySelector('.pers');
            input.value = 'typed-by-user';   // 模擬使用者輸入的暫態
            el.state.n = 1;                   // 觸發重繪
            await nextFrame();
            assertEq(el.querySelector('.n').textContent, '1', '計數應更新');
            assertEq(el.querySelector('.pers')?.value, 'typed-by-user', '持久節點輸入值應保留');
        });

        test('重繪後恢復輸入框焦點與游標位置', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<input id="focusable" value="abcdef"><span>${this.state.n}</span>`; }
            }
            customElements.define('t-focus', C);
            const el = mount(document.createElement('t-focus'));
            const input = el.querySelector('#focusable');
            input.focus();
            input.setSelectionRange(2, 4);
            el.state.n = 1;
            await nextFrame();
            const after = el.querySelector('#focusable');
            assertEq(document.activeElement, after, '焦點應恢復至輸入框');
            assertEq(after.selectionStart, 2, '游標起點');
            assertEq(after.selectionEnd, 4, '游標終點');
        });

        test('$t 在 i18n 未初始化時回傳鍵名 (不拋錯)', () => {
            class C extends BaseComponent { render() { return `<p class="t">${this.$t('nonexistent.key')}</p>`; } }
            customElements.define('t-i18n', C);
            const el = mount(document.createElement('t-i18n'));
            assertEq(el.querySelector('.t').textContent, 'nonexistent.key');
        });

        test('Lucide 圖示只在本元件內渲染，Light DOM 與 Shadow DOM 都會處理', async () => {
            await loadLucide();

            const outside = document.createElement('i');
            outside.setAttribute('data-lucide', 'home');
            host.appendChild(outside);

            class Light extends BaseComponent { render() { return '<i data-lucide="home"></i>'; } }
            class Shadow extends BaseComponent {
                static useShadow = true;
                render() { return '<i data-lucide="home"></i>'; }
            }
            customElements.define('t-icon-light', Light);
            customElements.define('t-icon-shadow', Shadow);
            const light = mount(document.createElement('t-icon-light'));
            const shadow = mount(document.createElement('t-icon-shadow'));

            assert(light.querySelector('svg.lucide-icon'), 'Light DOM 元件的圖示應被渲染');
            assert(shadow.shadowRoot.querySelector('svg.lucide-icon'), 'Shadow DOM 元件的圖示應被渲染');
            assert(outside.isConnected && outside.tagName === 'I', '元件外的圖示不應被元件更新順帶處理');
            outside.remove();
        });

        test('morph：一般元素重繪後保留同一節點，afterFirstRender 綁的監聽器仍有效', async () => {
            let clicks = 0;
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<p class="label">${this.state.n}</p><button class="btn">+</button>`; }
                afterFirstRender() { this.querySelector('.btn').addEventListener('click', () => clicks++); }
            }
            customElements.define('t-morph-keep', C);
            const el = mount(document.createElement('t-morph-keep'));
            const p = el.querySelector('.label');
            el.state.n = 1;
            await nextFrame();
            assertEq(el.querySelector('.label'), p, '應保留同一個 <p>');
            assertEq(p.textContent, '1', '文字應更新');
            el.querySelector('.btn').click();
            assertEq(clicks, 1, '重繪後監聽器應仍有效且只觸發一次');
        });

        test('morph：子元件（自訂元素）在父元件重繪時重建，維持生命週期', async () => {
            let connects = 0, disconnects = 0;
            class Child extends HTMLElement {
                connectedCallback() { connects++; }
                disconnectedCallback() { disconnects++; }
            }
            customElements.define('t-morph-child', Child);
            class Parent extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<span>${this.state.n}</span><t-morph-child></t-morph-child>`; }
            }
            customElements.define('t-morph-parent', Parent);
            const el = mount(document.createElement('t-morph-parent'));
            const child = el.querySelector('t-morph-child');
            el.state.n = 1;
            await nextFrame();
            assert(el.querySelector('t-morph-child') !== child, '子元件應為新實例');
            assertEq(connects, 2, 'connectedCallback 次數');
            assertEq(disconnects, 1, 'disconnectedCallback 次數');
        });

        test('morph：重建的自訂元素之後，後面的兄弟元素仍被保留', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<t-morph-sibling-child></t-morph-sibling-child><nav class="after"><b>${this.state.n}</b></nav>`; }
            }
            customElements.define('t-morph-sibling-child', class extends HTMLElement {});
            customElements.define('t-morph-sibling', C);
            const el = mount(document.createElement('t-morph-sibling'));
            const nav = el.querySelector('.after');
            el.state.n = 1;
            await nextFrame();
            assertEq(el.querySelector('.after'), nav, '自訂元素後面的 <nav> 應保留同一節點');
            assertEq(nav.textContent, '1');
        });

        test('morph：帶 id 的元素順序改變時搬移而不重建', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ items: ['a', 'b', 'c'] }); }
                render() { return `<ul>${this.state.items.map(i => `<li id="item-${i}">${i}</li>`).join('')}</ul>`; }
            }
            customElements.define('t-morph-keyed', C);
            const el = mount(document.createElement('t-morph-keyed'));
            const [a, b, c] = el.querySelectorAll('li');
            el.state.items = ['c', 'a'];
            await nextFrame();
            const after = [...el.querySelectorAll('li')];
            assertEq(after.length, 2, '項目數');
            assertEq(after[0], c, 'c 應為原節點並移到第一位');
            assertEq(after[1], a, 'a 應為原節點');
            assert(!b.isConnected, 'b 應被移除');
        });

        test('morph：表單控制項的值以新 HTML 為準（與重建結果相同）', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ v: 'one', on: true, pick: 'y' }); }
                render() {
                    return `<input class="text" value="${this.state.v}">
                            <input class="check" type="checkbox" ${this.state.on ? 'checked' : ''}>
                            <select class="sel">${['x', 'y'].map(o => `<option ${o === this.state.pick ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
                }
            }
            customElements.define('t-morph-form', C);
            const el = mount(document.createElement('t-morph-form'));
            const text = el.querySelector('.text');
            text.value = 'typed';
            el.state.v = 'two';
            el.state.on = false;
            el.state.pick = 'x';
            await nextFrame();
            assertEq(el.querySelector('.text'), text, '應保留同一個 input');
            assertEq(text.value, 'two', 'value 應更新');
            assertEq(el.querySelector('.check').checked, false, 'checked 應更新');
            assertEq(el.querySelector('.sel').value, 'x', 'select 應更新');
        });

        test('morph：沒有 id 的輸入框重繪後仍保有焦點與游標', async () => {
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<input class="no-id" value="abcdef"><span>${this.state.n}</span>`; }
            }
            customElements.define('t-morph-focus', C);
            const el = mount(document.createElement('t-morph-focus'));
            const input = el.querySelector('.no-id');
            input.focus();
            input.setSelectionRange(1, 3);
            el.state.n = 1;
            await nextFrame();
            assertEq(document.activeElement, input, '焦點應保留在同一個輸入框');
            assertEq(input.selectionStart, 1, '游標起點');
            assertEq(input.selectionEnd, 3, '游標終點');
        });

        test('morph：Lucide svg 在來源不變時保留，來源改變時重新產生', async () => {
            await loadLucide();
            class C extends BaseComponent {
                constructor() { super(); this.initReactiveState({ n: 0, spin: false }); }
                render() { return `<i data-lucide="home" class="${this.state.spin ? 'spin' : ''}"></i><span>${this.state.n}</span>`; }
            }
            customElements.define('t-morph-icon', C);
            const el = mount(document.createElement('t-morph-icon'));
            const svg = el.querySelector('svg');
            assert(svg && !svg.hasAttribute('data-lucide') && svg.getAttribute('data-lucide-icon') === 'home', '產生的 svg 應改用 data-lucide-icon');
            el.state.n = 1;
            await nextFrame();
            assertEq(el.querySelector('svg'), svg, '來源不變時應保留同一個 svg');
            el.state.spin = true;
            await nextFrame();
            const next = el.querySelector('svg');
            assert(next && next !== svg && next.classList.contains('spin'), '來源改變時應重新產生並帶上新 class');
        });

        test('核心入口：只用 lib/core.js 組出路由，authGuard 擋下受保護的路由', async () => {
            const core = await import('./lib/core.js');
            for (const name of ['html', 'BaseComponent', 'BaseService', 'appStore', 'router', 'matchRoute', 'registerRoute']) {
                assert(core[name], `core.js 應匯出 ${name}`);
            }
            if (!customElements.get('x-route')) core.registerRoute();
            const waitUntil = async (cond, ms = 3000) => {
                const start = performance.now();
                while (!cond()) {
                    if (performance.now() - start > ms) return false;
                    await nextFrame();
                }
                return true;
            };
            const { router } = core;
            const saved = { guard: router.authGuard, loginPath: router.loginPath, hash: location.hash };
            const box = mount(document.createElement('div'));
            box.innerHTML = `<x-switch>
                <x-route path="/core-secret" auth-required><b id="core-secret">secret</b></x-route>
                <x-route path="/core-login"><b id="core-login">login</b></x-route>
            </x-switch>`;
            const active = (id) => box.querySelector(`#${id}`).closest('x-route').hasAttribute('active');
            try {
                router.loginPath = '/core-login';
                router.authGuard = () => false;
                location.hash = '#/core-secret';
                assert(await waitUntil(() => location.hash === '#/core-login' && active('core-login')), '守衛不通過時應導向 loginPath');
                assert(!active('core-secret'), '受保護的路由不應啟用');
                router.authGuard = () => true;
                location.hash = '#/core-secret';
                assert(await waitUntil(() => active('core-secret')), '守衛通過時應啟用受保護的路由');
            } finally {
                router.authGuard = saved.guard;
                router.loginPath = saved.loginPath;
                history.replaceState(null, '', saved.hash || location.pathname);
                box.remove();
            }
        });

        test('vanilla-sdk：載入時把 auth-required 的守衛接上 authService，並帶出版本號', async () => {
            const { router } = await import('./lib/router.js');
            const saved = router.authGuard;
            try {
                const sdk = await import('./lib/vanilla-sdk.js');
                const { VERSION } = await import('./lib/version.js');
                assertEq(sdk.VERSION, VERSION, 'SDK 應匯出 VERSION');
                assertEq(sdk.VanillaSDK.version, VERSION, 'VanillaSDK.version');
                const { authService } = sdk;
                assertEq(router.authGuard(), authService.isAuthenticated, '守衛應依 authService 判斷');
                assertEq(router.authGuard(), false, '測試頁未登入，守衛應不放行');
            } finally {
                router.authGuard = saved;
            }
        });

        test('BaseComponent.css 放進 html 模板時輸出 <style> 元素，Shadow DOM 的 $slot 包 unsafe 後輸出原生 <slot>', async () => {
            const { html, unsafe } = await import('./lib/html.js');
            class C extends BaseComponent {
                static useShadow = true;
                render() {
                    return html`${BaseComponent.css`:host { display: block; }`}<div class="body">${unsafe(this.$slot())}</div>`;
                }
            }
            customElements.define('t-css-slot', C);
            const el = document.createElement('t-css-slot');
            el.innerHTML = '<b>投影內容</b>';
            mount(el);
            const root = el.shadowRoot;
            assert(root.querySelector('style'), '應產生 <style> 元素');
            assert(![...root.childNodes].some((n) => n.nodeType === Node.TEXT_NODE && n.textContent.includes(':host')), 'CSS 不應以文字顯示');
            assert(root.querySelector('.body > slot'), '應輸出原生 <slot>');
            assertEq(root.querySelector('slot').assignedNodes()[0]?.textContent, '投影內容');
        });

        test('morphUpdates = false 時改回整塊重繪', async () => {
            class C extends BaseComponent {
                static morphUpdates = false;
                constructor() { super(); this.initReactiveState({ n: 0 }); }
                render() { return `<p class="label">${this.state.n}</p>`; }
            }
            customElements.define('t-morph-off', C);
            const el = mount(document.createElement('t-morph-off'));
            const p = el.querySelector('.label');
            el.state.n = 1;
            await nextFrame();
            assert(el.querySelector('.label') !== p, '應為新的 <p>');
            assertEq(el.querySelector('.label').textContent, '1');
        });

        // === 執行 ===
        (async () => {
            for (const { name, fn } of tests) {
                try {
                    await fn();
                    results.push({ name, ok: true });
                } catch (e) {
                    results.push({ name, ok: false, error: e.message });
                }
            }

            const ul = document.getElementById('results');
            ul.innerHTML = results.map(r =>
                `<li class="${r.ok ? 'ok' : 'ng'}">${r.name}` +
                (r.ok ? '' : `<div class="err">${r.error}</div>`) + `</li>`
            ).join('');

            const passed = results.filter(r => r.ok).length;
            const summary = document.getElementById('summary');
            const allPass = passed === results.length;
            summary.className = allPass ? 'pass' : 'fail';
            summary.textContent = `${passed} / ${results.length} 通過` + (allPass ? ' 🎉' : '');

            // 供自動化擷取
            window.__TEST_RESULTS__ = { passed, total: results.length, results };
        })();
    </script>
</body>
</html>
